<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SIGANALYZER — 404 Signal Not Found</title>
  <script>
    // Client-side SPA route redirect for static hosting
    (function() {
      var path = window.location.pathname;
      if (path && path !== '/' && path !== '/404.html' && path !== '/404') {
        window.location.replace('/#' + path + (window.location.search || '') + (window.location.hash || ''));
      }
    })();
  </script>
  <link rel="icon" type="image/svg+xml" href="/public/favicon.svg">
  <link rel="stylesheet" href="/src/styles/variables.css">
  <link rel="stylesheet" href="/src/styles/reset.css">
  <link rel="stylesheet" href="/src/styles/typography.css">
  <link rel="stylesheet" href="/src/styles/components.css">
  <link rel="stylesheet" href="/src/styles/main.css">
</head>
<body class="bg-obsidian min-h-screen flex items-center justify-center text-center p-6">
  <div class="card p-8 max-w-lg mx-auto" style="border: 1px solid var(--border-accent-cyan);">
    <div class="badge badge-accent mb-4 font-mono">STATUS: 404_CARRIER_LOSS</div>
    <h1 class="text-3xl font-bold mb-3 tracking-tight">Signal Not Found</h1>
    <p class="text-secondary text-sm mb-6">The requested frequency or path contains no detectable modulation or carrier energy.</p>
    <a href="/#/" class="btn btn-primary">Return to Base Station</a>
  </div>
</body>
</html>
